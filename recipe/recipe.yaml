schema_version: 1

context:
  name: financetoolkit
  version: "2.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/financetoolkit-${{ version }}.tar.gz
  sha256: 7c392d14cd1e6aa1d9d8b558fa11b619b254d84114d121084a82d5e007e1a962

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=3.0
    - numpy >=1.26
    - scipy >=1.10
    - python-calamine >=0.3.0
    - xlrd >=2.0
    - requests >=2.32
    - yfinance
    - openpyxl >=3.1
    # Not listed but required
    - pyyaml >=6.0

tests:
  - python:
      imports:
        - financetoolkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Transparent and Efficient Financial Analysis
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/JerBouma/FinanceToolkit

extra:
  recipe-maintainers:
    - thewchan
