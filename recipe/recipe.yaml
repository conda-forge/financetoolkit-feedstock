schema_version: 1

context:
  name: financetoolkit
  version: "2.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/financetoolkit-${{ version }}.tar.gz
  sha256: 72e09b19639ac1bb0bb99d58685794bbcc421b67ea45ded34428e95be96798bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=3.0
    - scikit-learn >=1.6
    - requests >=2.32
    - yfinance
    - openpyxl >=3.1
    # Not listed but required
    - pyyaml >=6.0

tests:
  - python:
      imports:
        - financetoolkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Transparent and Efficient Financial Analysis
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/JerBouma/FinanceToolkit

extra:
  recipe-maintainers:
    - thewchan
